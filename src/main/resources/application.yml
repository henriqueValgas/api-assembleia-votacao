spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assembleiadb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

user-info:
  url: ${USER_INFO_URL:http://localhost:8081}


kind: Application

